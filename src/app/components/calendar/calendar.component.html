<header class="toolbar">
  <mat-toolbar>
    <button mat-icon-button>
      <mat-icon>menu</mat-icon>
    </button>
    <span>Jobsity challenge</span>
    <span class="spacer"></span>
    <button mat-button (click)="openReminderForm()">
      <mat-icon>add</mat-icon> New reminder
    </button>
  </mat-toolbar>
</header>

<section class="calendar">
  <div class="calendar__header">
    <div *ngFor="let day of week" class="header__cell">
      {{ day | titlecase }}
    </div>
  </div>
  <div class="calendar__grid">
    <div *ngFor="let d of month"
         class="grid__cell"
         (click)="openReminderFormByDay(d.id, $event)"
         [ngClass]="{
           'grid__cell--weekend': d.weekDay === 'sunday' || d.weekDay == 'saturday',
           'grid__cell--dummy' : d.day === null
         }">
      <h3>{{ d.day }}</h3>

      <div class="reminders">
        <ng-container *ngIf="d.reminders.length">
          <div class="reminders__list">
            <button *ngFor="let reminder of d.reminders | slice: 0:itemsLimit"
                    (click)="openReminderForm(reminder)"
                    class="reminder"
                    [ngClass]="{
               'reminder--red' : reminder.color === 'red',
               'reminder--green' : reminder.color === 'green',
               'reminder--yellow' : reminder.color === 'yellow',
               'reminder--purple' : reminder.color === 'purple'
             }">
              {{ reminder.text }}
            </button>
          </div>
          <p class="reminders__counter" *ngIf="d.reminders.length > itemsLimit"
          >{{ d.reminders.length - itemsLimit }} more
          </p>
        </ng-container>
      </div>
    </div>
  </div>
</section>
